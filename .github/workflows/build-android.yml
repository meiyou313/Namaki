# SPDX-License-Identifier: GPL-3.0-or-later
# Namaki — Flutter UI + Go core.
#
# Builds Android, Windows, and Linux on GitHub Actions and publishes
# them on one v3.4.3 GitHub release (Releases tab): the APKs, the
# Windows portable zip, and the Linux archive.
#
# The Windows and Linux apps start a desktop core (arman-vpn-core) from
# a core/ folder beside the app; that core's source is not in this repo,
# so those jobs clone it from the Arman VPN client repository at the
# pinned commit (UPSTREAM_CORE_SHA) and build it there. No signing key
# is used: without one the desktop apps offer update downloads instead
# of installing them silently.
#
# Trigger it with: Actions > Build > Run workflow.
# No signing secrets are needed: without them the APKs are signed with
# the debug key. For a release key, add these secrets:
#   ANDROID_KEYSTORE_BASE64    the .p12 file (PKCS12), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password (PKCS12: also the key's)
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GO_VERSION: '1.26.9'
  # The Arman VPN client commit the desktop core is built from (the
  # core's dashboard API is what this app's desktop code talks to).
  UPSTREAM_CORE_SHA: 95f8691d45bcf6c7451c677ed8127908537b621b

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Go core checks
        working-directory: predator-core
        run: |
          gofmt -l mobile engine
          go mod tidy
          go test -timeout 90s ./mobile
          go vet ./mobile
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Android toolchain
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          test -f "$ANDROID_HOME/ndk/28.0.13004108/meta/platforms.json"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: app/android/app/libs/
          key: merged-native-go1.26.9-ndk28-${{ hashFiles('predator-core/mobile/**/*.go', 'predator-core/engine/**/*.go', 'predator-core/tools.go', 'predator-core/go.mod', 'predator-core/go.sum') }}
      - name: Build native Android library (Go core -> foxvpn.aar)
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: predator-core
        run: |
          # NOTE: do not set ANDROID_NDK_HOME from ${{ env.ANDROID_HOME }} —
          # the env context does not carry the runner's ANDROID_HOME, so it
          # expands to an empty string and gomobile sees "/ndk/...".
          # The "Android toolchain" step already exported the correct
          # ANDROID_NDK_HOME via GITHUB_ENV; re-export it from the shell here.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          test -f "$ANDROID_NDK_HOME/meta/platforms.json"
          go mod tidy
          go install github.com/sagernet/gomobile/cmd/gomobile
          go install github.com/sagernet/gomobile/cmd/gobind
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          mkdir -p ../app/android/app/libs
          gomobile bind -v -target android -androidapi 26 \
            -javapkg=com.foxvpn.nativebridge -libname=foxvpn -trimpath \
            -tags with_gvisor,with_clash_api,with_conntrack \
            -ldflags '-X github.com/sagernet/sing-box/constant.Version=1.12.0 -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../app/android/app/libs/foxvpn.aar ./mobile github.com/sagernet/sing-box/experimental/libbox
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: app/android/app/libs/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Bundle dependency notices
        run: node scripts/android-notices.cjs
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no release key: the APKs are signed with a debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -di > app/android/release.p12
          openssl pkcs12 -in app/android/release.p12 -noout -passin pass:"$PASSWORD" || { echo "::error::the release keystore does not open with the stored password"; exit 1; }
          printf 'storeFile=../release.p12\nstoreType=pkcs12\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > app/android/key.properties
      - name: Build APKs
        run: |
          mkdir -p out
          cd app
          flutter pub get
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=3.4.3
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../out/namaki-3.4.3-Android-$abi.apk"
          done
          flutter build apk --release --dart-define=APP_VERSION=3.4.3
          cp build/app/outputs/flutter-apk/app-release.apk ../out/namaki-3.4.3-Android-universal.apk
      - name: Remove the key
        if: always()
        run: rm -f app/android/release.p12 app/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the desktop core source
        run: |
          git clone https://github.com/armanlife/arman-vpn-client upstream-core
          git -C upstream-core checkout ${{ env.UPSTREAM_CORE_SHA }}
      # The core's go.mod asks for Go 1.27.2; read it from the clone.
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream-core/core/go.mod
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build the Windows app
        shell: pwsh
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --dart-define=APP_VERSION=3.4.3
          if (-not (Test-Path 'build/windows/x64/runner/Release/d3dcompiler_47.dll')) { throw 'd3dcompiler_47.dll is not in the build: the window would stay empty on some copies of Windows' }
      - name: Build the desktop core and TUN service
        shell: pwsh
        working-directory: upstream-core/core
        env:
          APP_VERSION: 3.4.3
          CGO_ENABLED: '0'
        run: |
          $core = "$env:GITHUB_WORKSPACE/app/build/windows/x64/runner/Release/core"
          New-Item -ItemType Directory -Force $core | Out-Null
          $ldflags = '-s -w -X github.com/armanlife/arman-vpn-client/core/internal/version.Current=3.4.3'
          go generate ./cmd/arman-vpn-core
          go build -trimpath -ldflags $ldflags -o "$core/arman-vpn-core.exe" ./cmd/arman-vpn-core
          go generate ./cmd/arman-vpn-tun
          go build -tags with_gvisor -trimpath -ldflags "-s -w -H windowsgui -X github.com/armanlife/arman-vpn-client/core/internal/version.Current=3.4.3" -o "$core/arman-vpn-tun.exe" ./cmd/arman-vpn-tun
      - name: Package the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $stage = 'out/stage/Namaki'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'app/build/windows/x64/runner/Release/*' $stage -Recurse
          Copy-Item 'LICENSE' $stage
          Compress-Archive -Path $stage -DestinationPath 'out/namaki-3.4.3-Windows-x64.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/namaki-3.4.3-Windows-x64.zip
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone the desktop core source
        run: |
          git clone https://github.com/armanlife/arman-vpn-client upstream-core
          git -C upstream-core checkout ${{ env.UPSTREAM_CORE_SHA }}
      # The core's go.mod asks for Go 1.27.2; read it from the clone.
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream-core/core/go.mod
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build the Linux app
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release --dart-define=APP_VERSION=3.4.3
      - name: Build the desktop core and TUN service
        working-directory: upstream-core/core
        run: |
          module=github.com/armanlife/arman-vpn-client/core
          ldflags="-s -w -X $module/internal/version.Current=3.4.3"
          dest="$GITHUB_WORKSPACE/app/build/linux/x64/release/bundle/core"
          mkdir -p "$dest"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o "$dest/arman-vpn-core" ./cmd/arman-vpn-core
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags with_gvisor -trimpath -ldflags "$ldflags" -o "$dest/arman-vpn-tun" ./cmd/arman-vpn-tun
      - name: Package the archive
        run: |
          mkdir -p out/stage
          cp -r app/build/linux/x64/release/bundle out/stage/Namaki
          cp LICENSE out/stage/Namaki/LICENSE
          tar -czf out/namaki-3.4.3-Linux-amd64.tar.gz -C out/stage --owner=0 --group=0 Namaki
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/namaki-3.4.3-Linux-amd64.tar.gz
          if-no-files-found: error

  release:
    needs: [android, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.4.3
          name: Namaki 3.4.3
          body: |
            Namaki 3.4.3.
            Install the APK for your phone's processor (arm64-v8a for most modern phones), or the universal one.
            On Windows, unpack namaki-3.4.3-Windows-x64.zip anywhere and run the app inside the Namaki folder.
            On Linux, unpack namaki-3.4.3-Linux-amd64.tar.gz and run the app inside the Namaki folder.
          files: out/*
          fail_on_unmatched_files: true
