org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# DO NOT re-add android.newDsl=false here: the Flutter migrator adds it,
# but it is wrong for AGP 9 — with it, the android{} block resolves to the
# deprecated BaseAppModuleExtension and AGP 9 treats that deprecation as a
# script-compilation error. newDsl stays at AGP 9's own default (true).
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compilation breaks on this toolchain ("Could not
# close incremental caches" in webview_flutter_android); builds are a
# little slower without it, nothing else changes.
kotlin.incremental=false
