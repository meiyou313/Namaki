name: merged_vpn
description: "Namaki — Android VPN app"
publish_to: 'none'

version: 3.4.8+348

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
  file_selector: ^1.1.0
  intl: any

# Packages published less than two weeks ago are held back until they have
# been out longer.
dependency_overrides:
  vector_graphics_compiler: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from lib/l10n/*.arb (l10n.yaml).
  generate: true

  assets:
    # The hen beside the app's name.
    - assets/logo.png
    # The portrait in the prayer card at the end of the settings.
    - assets/dua.png
    - assets/tray/
    # Country flags from flag-icons (MIT, assets/flags/LICENSE), the same
    # SVG files as the core's web dashboard.
    - assets/flags/

  fonts:
    # Vazirmatn (SIL Open Font License 1.1, assets/fonts/OFL.txt) for Persian.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
